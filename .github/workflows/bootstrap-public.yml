name: Publish reviewed RideBili source
on:
  push:
    paths:
      - .github/workflows/bootstrap-public.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    if: github.repository == 'SleepyK911/RideBili'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Import the hash-verified 0.1.21 source archive
        shell: bash
        run: |
          set -euo pipefail
          asset_url=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.tag_name == "v0.1.21") | .assets[] | select(.name == "RideBili-0.1.21-Source.zip") | .url')
          test -n "$asset_url"
          gh api "$asset_url" -H 'Accept: application/octet-stream' > "$RUNNER_TEMP/source.zip"
          echo "cf93161cdf1bb5b2d11729422dd8087cc939aed1f4050c9b4e3248207199eeaa  $RUNNER_TEMP/source.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/source.zip" -d "$RUNNER_TEMP/unpacked"
          gh auth setup-git
          git clone --branch main "https://github.com/$GITHUB_REPOSITORY.git" "$RUNNER_TEMP/repository"
          cd "$RUNNER_TEMP/repository"
          source="$RUNNER_TEMP/unpacked/RideBili-0.1.21"
          for item in "$source"/* "$source"/.gitignore; do
            [ "$(basename "$item")" = third-party-audio ] && continue
            cp -a "$item" .
          done
          git config user.name SleepyK911
          git config user.email 83480611+SleepyK911@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Publish RideBili 0.1.21 source, documentation and interface screenshots'
            git push origin HEAD:main
          fi
          if ! git ls-remote --exit-code --tags origin refs/tags/v0.1.21 >/dev/null; then
            git tag v0.1.21
            git push origin refs/tags/v0.1.21
          fi
